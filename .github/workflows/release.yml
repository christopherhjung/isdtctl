name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing must not cost the rest of the release.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            gui: true
          - target: x86_64-apple-darwin
            os: macos-14
            gui: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            gui: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            gui: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            gui: true
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            gui: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libvulkan-dev \
            libssl-dev \
            pkg-config

      - name: Point bindgen at the macOS SDK
        if: runner.os == 'macOS'
        run: |
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      # The command line tool is the one that must always ship.
      - name: Build isdtctl
        run: cargo build --release --locked -p cli --target ${{ matrix.target }}

      # The window pulls in a graphics stack and is best effort outside macOS.
      # A failure here is reported but does not sink the target.
      - name: Build isdt-gui
        id: gui
        if: matrix.gui
        continue-on-error: true
        run: cargo build --release --locked -p gui --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          stage="isdt-${TAG#v}-${{ matrix.target }}"
          mkdir -p "dist/$stage"

          bin_dir="target/${{ matrix.target }}/release"
          suffix=""
          [ "${{ runner.os }}" = "Windows" ] && suffix=".exe"

          cp "$bin_dir/isdtctl$suffix" "dist/$stage/"
          # The window is best effort outside macOS. Say so in the archive
          # rather than shipping one that quietly lacks it.
          if [ -f "$bin_dir/isdt-gui$suffix" ]; then
            cp "$bin_dir/isdt-gui$suffix" "dist/$stage/"
          else
            echo "isdt-gui did not build for ${{ matrix.target }}." \
              > "dist/$stage/isdt-gui.MISSING.txt"
          fi
          cp README.md PROTOCOL.md LICENSE "dist/$stage/"

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$stage.zip" "$stage" >/dev/null
            certutil -hashfile "$stage.zip" SHA256 | sed -n 2p | tr -d " \r" \
              > "$stage.zip.sha256"
          else
            tar czf "$stage.tar.gz" "$stage"
            if command -v sha256sum >/dev/null; then
              sha256sum "$stage.tar.gz" | cut -d" " -f1 > "$stage.tar.gz.sha256"
            else
              shasum -a 256 "$stage.tar.gz" | cut -d" " -f1 > "$stage.tar.gz.sha256"
            fi
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: isdt-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # Ship whatever built rather than nothing at all; the run page shows which
    # targets failed.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List what is being published
        run: ls -lh dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
