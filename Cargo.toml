[package]
name = "isdt-charger"
version = "0.1.0"
edition = "2021"
description = "Bluetooth Low Energy client for ISDT chargers (CM1620 and relatives), reimplemented from the ISDT Android app protocol"
license = "MIT OR Apache-2.0"

[lib]
name = "isdt_charger"
path = "src/lib.rs"

[[bin]]
name = "isdtctl"
path = "src/main.rs"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustyline = "18.0.1"
shell-words = "1.1.1"
