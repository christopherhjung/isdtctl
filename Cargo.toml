[workspace]
resolver = "2"
members = ["crates/api", "crates/gui", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/anabrid/isdt-charger"
rust-version = "1.87"

[workspace.dependencies]
api = { version = "0.1.0", path = "crates/api" }

anyhow = "1"
async-trait = "0.1"
btleplug = "0.11"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
